<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Social Clap</title>
<meta name="description" content="La página que buscás no existe o cambió de lugar.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--soft:#475569;--accent:#1F5BFF;--accent-dark:#1749D6;--accent-soft:#E8F0FF;--border:#E6EAF0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#F5F7FA;color:var(--ink);font-family:'Inter',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{max-width:520px;width:100%;background:#fff;border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(15,23,42,.08)}
.code{font-family:'Sora',sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--accent);margin:0 0 8px}
h1{font-family:'Sora',sans-serif;font-size:24px;margin:0 0 10px}
p{color:var(--soft);line-height:1.6;margin:0 0 22px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(31,91,255,.3)}
.links{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);display:grid;gap:8px;text-align:left}
.links span{font-size:13px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.links a{color:var(--accent-dark);text-decoration:none;font-weight:600;font-size:15px}
.links a:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="box">
  <p class="code">404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el link esté mal escrito o que la página haya cambiado de lugar.</p>
  <a class="btn" href="/">Volver al inicio</a>
  <nav class="links" aria-label="Páginas útiles">
    <span>Quizás buscabas</span>
    <a href="/agente-ia-whatsapp-tienda-nube/">Agente de IA para WhatsApp en Tienda Nube</a>
    <a href="/chatbot-whatsapp-vs-agente-ia/">Chatbot vs. agente de IA</a>
    <a href="/cuanto-cuesta-agente-ia-whatsapp/">Cuánto cuesta un agente de IA para WhatsApp</a>
    <a href="/#oferta">Ver la oferta</a>
  </nav>
</main>
</body>
</html>
